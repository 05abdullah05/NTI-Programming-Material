<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="drop.css">
    <title>Dropdowm</title>
</head>
<body>
    <!-- The black menu bar -->
    <div class="navigation">
        <!-- Unordered list, li = list element, inside li = LIST we have a link-->
        <ul>
            <li><a href="">Link1</a></li>
            <li><a href="">Link2</a></li>
            <!-- The link with the drop down menu should have a class name in (li). Even the name drop should have a button class on tag (a) -->
            
            <li class="dropDown">
                <a href="DropBtn">Drop</a>   
                <!-- When we hover the dropdown the DropBtn has same properties as dropdown  -->
                <!-- We need to create a div for what the menu should show and use the link tags (a). This drop down menu bar will show everything in the dropcontent div. -->
                <div class="dropContent">
                    <a href="">Drop1</a>
                    <a href="">Drop2</a>
                    <a href="">Drop3</a>
                    <a href="">Drop4</a>
                    <a href="">Drop5</a>
                </div>
            </li>

            <li><a href="">Link4</a></li>
            <li><a href="">Link5</a></li>
            <li><a href="">Link6</a></li>
        </ul>   

    </div>
</body>
</html>
